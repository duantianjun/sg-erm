# SG-ERM Docker Compose
#
# 使用方法:
#   1. cp .env.example .env && 编辑 .env（必须设置 SG_ERM_SECRET_KEY）
#   2. docker compose up -d
#
# 访问:
#   Web UI:  http://localhost:18070
#   API 文档: http://localhost:18070/api/docs
#   健康检查: http://localhost:18070/health
#
# 生产部署:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  sg-erm:
    build:
      context: .
      dockerfile: Dockerfile
    image: sg-erm:latest
    container_name: sg-erm
    restart: unless-stopped
    ports:
      - "18070:18070"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - sg-erm-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:18070/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  sg-erm-data:
    driver: local
