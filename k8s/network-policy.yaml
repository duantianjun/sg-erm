# NetworkPolicy：限制入站流量来源
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sg-erm-access
  namespace: stackgres
  labels:
    app.kubernetes.io/name: sg-erm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sg-erm
  policyTypes:
    - Ingress
  ingress:
    # 允许同命名空间的 Pod 访问（StackGres 集群）
    - from:
        - podSelector: {}
      ports:
        - port: 18070
          protocol: TCP
    # 允许 Ingress Controller 命名空间访问
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 18070
          protocol: TCP
    # 允许带 monitoring 标签的命名空间访问（Prometheus /metrics）
    - from:
        - namespaceSelector:
            matchLabels:
              monitoring: "true"
      ports:
        - port: 18070
          protocol: TCP
